name: Update phone list

on:
  schedule:
    - cron: '17 19 * * *'   # every day 3:17am Perth time
  workflow_dispatch:         # "Run workflow" button to update now

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and build both phone lists
        run: python scripts/build.py

      - name: Save the new lists
        run: |
          git config user.name "phone-list bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in tacdb.json devices.json last-checked.txt; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Phone list update $(date -u +%F)"
          git push

      - name: Refresh the CDN copy the POS reads
        run: |
          for f in tacdb.json devices.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" || true
          done
